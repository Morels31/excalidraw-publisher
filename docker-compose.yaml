services:
  # Converts the vault and renders the site into ./public/site. It has no
  # network access at all: nothing is served from this container.
  quartz:
    build: .
    container_name: excalidraw-publisher
    restart: unless-stopped
    stop_grace_period: 20s
    network_mode: none
    environment:
      # Set your public domain for canonical links and sitemaps
      - BASE_URL=${BASE_URL:-notes.example.com}
      - SITE_TITLE=${SITE_TITLE:-Appunti Uni}
      - STARTUP_HASH_CHECK=${STARTUP_HASH_CHECK:-0}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      # Mount the folder you want to publish (read-only). Both the host path
      # and the folder name come from .env.
      # WARNING: Keep the destination path relative to your vault root
      # (e.g. /vault-input/<folder-name>).
      - ${VAULT_PATH:-/path/to/vault}/${VAULT_SUBDIR:-notes}:/vault-input/${VAULT_SUBDIR:-notes}:ro

      # Persistent host directory for converted notes and SVGs.
      # Create it with: mkdir -p quartz-content && sudo chown -R 10001:10001 quartz-content
      - ./quartz-content:/usr/src/app/content

      # Rendered site, published read-only by the web container.
      # Create it with: mkdir -p public && sudo chown -R 10001:10001 public
      - ./public:/usr/src/app/public

  # Serves the rendered site. Runs as the same user as the publisher so both
  # sides agree on file ownership.
  web:
    image: nginxinc/nginx-unprivileged:alpine
    container_name: excalidraw-publisher-web
    restart: unless-stopped
    user: "10001:10001"
    depends_on:
      quartz:
        condition: service_healthy
    ports:
      - "${HOST_PORT:-8080}:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
