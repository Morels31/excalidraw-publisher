# Replaces the image's default server block. Quartz emits `foo/index.html` for
# folder indexes and `foo.html` for notes, and resolves `/foo` through the index
# first; the order below mirrors that so extensionless links keep working.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    # The base image does not enable compression.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    location / {
        try_files $uri $uri/index.html $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
