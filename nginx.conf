# Replaces the image's default server block. Quartz writes both `foo.html` and
# `foo/index.html`, and its built-in server resolves `/foo` through both; mirror
# that order here so extensionless links keep working.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/index.html $uri/ =404;
    }

    error_page 404 /404.html;
}
